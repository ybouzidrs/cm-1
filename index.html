<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ARTIFACT-START -->
<title>Mission Volcans</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Mise en page : une feuille de cahier Seyès, une colonne de « fiches » posées dessus, le magma comme seule couleur vive. */
:root {
  --bg: #eef3f8;
  --paper: #ffffff;
  --ink: #1f2635;
  --muted: #5b6579;
  --rule: #cfdaea;
  --line: #d9e3f2;
  --line-strong: #c3d2ea;
  --magma: #e2512a;
  --magma-dark: #b33a18;
  --lava: #f4a51c;
  --basalt: #33405a;
  --ok: #23925a;
  --ok-soft: #dff3e8;
  --bad: #cf2e3e;
  --bad-soft: #fbe2e5;
  --info-soft: #e5edfb;
  --blank: #fff3dc;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Andika", "Verdana", "Segoe UI", system-ui, sans-serif;
  --radius: 16px;
  /* couleurs fixes des dessins scientifiques */
  --crust: #8b5a36;
  --mantle: #f08a3c;
  --mantle-2: #e9672d;
  --core: #ffd34d;
  --core-2: #f6a623;
  --rock: #6b5446;
  --rock-dark: #4b3a30;
  --strata-1: #c9a77c;
  --strata-2: #b48e63;
  --strata-3: #9e7a52;
  --ash: #9aa0aa;
  --ash-2: #b9bec6;
  --mark-bg: #ffffff;
  --mark-ink: #1f2635;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131823; --paper: #1d2433; --ink: #eef1f7; --muted: #a6b0c3; --rule: #34405a;
    --line: #1a2130; --line-strong: #212a3c; --magma: #ff7148; --magma-dark: #c94a24; --lava: #ffc14d;
    --basalt: #c8d2e4; --ok: #4cc785; --ok-soft: #173a29; --bad: #ff6b7a; --bad-soft: #43202a;
    --info-soft: #222f4a; --blank: #3a2f1c; --ash: #7d838e; --ash-2: #969ca6; --mark-bg: #1d2433; --mark-ink: #eef1f7;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131823; --paper: #1d2433; --ink: #eef1f7; --muted: #a6b0c3; --rule: #34405a;
  --line: #1a2130; --line-strong: #212a3c; --magma: #ff7148; --magma-dark: #c94a24; --lava: #ffc14d;
  --basalt: #c8d2e4; --ok: #4cc785; --ok-soft: #173a29; --bad: #ff6b7a; --bad-soft: #43202a;
  --info-soft: #222f4a; --blank: #3a2f1c; --ash: #7d838e; --ash-2: #969ca6; --mark-bg: #1d2433; --mark-ink: #eef1f7;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  background-image:
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--line-strong) 31px 32px),
    repeating-linear-gradient(to bottom, transparent 0 7px, var(--line) 7px 8px);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.5;
  min-height: 100vh;
}
.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; letter-spacing: .01em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--lava); outline-offset: 2px; }

.card { background: var(--paper); border: 2px solid var(--rule); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

/* Accueil */
.hero { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
.hero .eyebrow { font-size: .85rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.hero h1 { font-size: clamp(2.3rem, 9vw, 3.6rem); line-height: 1; color: var(--magma); }
.hero h1 span { color: var(--ink); display: block; font-size: .55em; margin-top: 4px; }
.hero svg { width: clamp(90px, 24vw, 140px); height: auto; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.name-field { display: flex; align-items: center; gap: 8px; flex: 1 1 220px; }
.name-field label { font-weight: 700; white-space: nowrap; }
.name-field input { flex: 1; min-width: 0; font: inherit; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--rule); background: var(--paper); color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 2px solid var(--rule); background: var(--paper); font-weight: 700; }
.pill .star { color: var(--lava); }

.section-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.section-title h2 { font-size: 1.5rem; }
.section-title small { color: var(--muted); font-size: .95rem; }
.missions { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.mission {
  text-align: left; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center;
  padding: 14px; border-radius: var(--radius); background: var(--paper); border: 2px solid var(--rule);
  box-shadow: 0 4px 0 var(--rule); transition: transform .12s, box-shadow .12s;
}
.mission:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--rule); }
.mission:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--rule); }
.mission .num { grid-row: span 3; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 1.35rem; color: #fff; background: var(--magma); }
.mission .t { font-weight: 700; line-height: 1.2; }
.mission .s { color: var(--muted); font-size: .9rem; line-height: 1.25; }
.stars { color: var(--rule); letter-spacing: 2px; font-size: 1.05rem; }
.stars .on { color: var(--lava); }
.mission.big { grid-column: 1 / -1; background: var(--basalt); border-color: var(--basalt); color: var(--paper); box-shadow: 0 4px 0 var(--magma-dark); }
.mission.big .s { color: var(--paper); opacity: .85; }
.mission.big .num { background: var(--lava); color: #2a1d05; }
.mission.big .stars { color: color-mix(in srgb, var(--paper) 35%, transparent); }
.mission.big .stars .on { color: var(--lava); }

/* Écran de jeu */
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.back { border: 2px solid var(--rule); background: var(--paper); border-radius: 12px; padding: 6px 12px; font-weight: 700; }
.topbar h1 { font-size: 1.6rem; flex: 1 1 200px; }
.progress { height: 12px; border-radius: 999px; background: var(--paper); border: 2px solid var(--rule); overflow: hidden; }
.progress > div { height: 100%; background: linear-gradient(90deg, var(--lava), var(--magma)); transition: width .3s; }
.qnum { color: var(--muted); font-weight: 700; font-size: .9rem; text-transform: uppercase; letter-spacing: .08em; }
.qtext { font-family: var(--font-body); font-weight: 700; font-size: 1.3rem; line-height: 1.35; }
.choices { display: grid; gap: 10px; }
.choices.vf { grid-template-columns: 1fr 1fr; }
.choice { text-align: left; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--rule); background: var(--paper); font-size: 1.08rem; line-height: 1.3; box-shadow: 0 3px 0 var(--rule); }
.choices.vf .choice { text-align: center; font-family: var(--font-display); font-size: 1.5rem; padding: 18px; }
.choice:hover:not(:disabled) { border-color: var(--magma); }
.choice:disabled { cursor: default; }
.choice.ok { background: var(--ok-soft); border-color: var(--ok); box-shadow: 0 3px 0 var(--ok); }
.choice.bad { background: var(--bad-soft); border-color: var(--bad); box-shadow: 0 3px 0 var(--bad); }
.feedback { border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.feedback.ok { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback strong.head { font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; }
.feedback.ok strong.head { color: var(--ok); }
.feedback.bad strong.head { color: var(--bad); }

.btn { border: 0; border-radius: 14px; padding: 12px 20px; font-family: var(--font-display); font-size: 1.25rem; letter-spacing: .02em; background: var(--magma); color: #fff; box-shadow: 0 4px 0 var(--magma-dark); align-self: flex-start; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--magma-dark); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.alt { background: var(--paper); color: var(--ink); border: 2px solid var(--rule); box-shadow: 0 4px 0 var(--rule); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.hint { color: var(--muted); font-size: .95rem; }
.note { background: var(--info-soft); border-radius: 12px; padding: 12px 14px; font-size: .98rem; }

/* Textes à trous et légendes */
.text-holes { font-size: 1.12rem; line-height: 2.3; }
.blank {
  display: inline-block; min-width: 5.5em; padding: 0 10px; margin: 0 2px; line-height: 1.6;
  border: 0; border-bottom: 3px dashed var(--magma); background: var(--blank); border-radius: 8px 8px 0 0;
  font-weight: 700; color: var(--ink); vertical-align: baseline;
}
.blank.empty { color: var(--muted); font-weight: 400; }
.blank.active { outline: 3px solid var(--lava); outline-offset: 1px; }
.blank.right { background: var(--ok-soft); border-bottom: 3px solid var(--ok); color: var(--ok); cursor: default; }
.blank.wrong { animation: shake .4s; background: var(--bad-soft); border-bottom-color: var(--bad); }
.blank.revealed { background: var(--info-soft); border-bottom: 3px solid var(--basalt); cursor: default; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border-radius: 14px; background: var(--bg); border: 2px dashed var(--rule); }
.chip { padding: 6px 14px; border-radius: 999px; border: 2px solid var(--basalt); background: var(--paper); font-weight: 700; box-shadow: 0 3px 0 var(--rule); }
.chip:hover { border-color: var(--magma); }
.legend-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.legend-list li { display: flex; align-items: center; gap: 10px; }
.legend-list .n { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--paper); font-family: var(--font-display); }
.legend-list .blank { flex: 1; text-align: left; min-width: 0; }
.diagram-row { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: center; }
@media (max-width: 600px) { .diagram-row { grid-template-columns: 1fr; } }
.diagram { width: 100%; max-width: 420px; height: auto; margin: 0 auto; display: block; }
.diagram text, .plates-svg text { font-family: var(--font-display); }

/* Relie */
.match { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 10px 16px; }
.match .col { display: flex; flex-direction: column; gap: 10px; }
.mitem { text-align: left; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--rule); background: var(--paper); line-height: 1.3; position: relative; box-shadow: 0 3px 0 var(--rule); display: flex; align-items: center; gap: 10px; min-height: 64px; }
.mitem .dot { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px dashed var(--rule); }
.mitem.sel { outline: 3px solid var(--lava); }
.mitem.wrong { animation: shake .4s; border-color: var(--bad); }
.mitem.right { border-color: var(--ok); }

/* Ordre */
.order-done { display: flex; flex-direction: column; gap: 8px; counter-reset: step; padding: 0; margin: 0; list-style: none; }
.order-done li { counter-increment: step; display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--ok-soft); border: 2px solid var(--ok); }
.order-done li::before { content: counter(step); flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); color: var(--paper); font-family: var(--font-display); }
.order-pool { display: grid; gap: 10px; }
.ocard { text-align: left; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--rule); background: var(--paper); box-shadow: 0 3px 0 var(--rule); line-height: 1.3; }
.ocard.wrong { animation: shake .4s; border-color: var(--bad); background: var(--bad-soft); }

/* Plaques */
.plates-svg { width: 100%; height: auto; display: block; border-radius: 12px; background: var(--info-soft); }
.plate, .slab, .mountain, .rise { transition: transform 1.2s ease-in-out, opacity .8s; transform-box: fill-box; }
.mountain { transform-origin: 50% 100%; transform: scaleY(.12); }
.rise { transform-origin: 50% 100%; transform: scaleY(0); }
.slab { opacity: 0; }
.scene-collide .plate-a { transform: translateX(22px); }
.scene-collide .plate-b { transform: translateX(-22px); }
.scene-collide .slab { opacity: 1; transform: translateX(22px); }
.scene-collide .mountain { transform: translateX(-22px) scaleY(1); }
.scene-collide .quake { animation: quake .25s 1.1s 4; }
.scene-apart .plate-a { transform: translateX(-26px); }
.scene-apart .plate-b, .scene-apart .mountain { transform: translateX(26px) scaleY(.12); }
.scene-apart .plate-b { transform: translateX(26px); }
.scene-apart .rise { transform: scaleY(1); }
.scene-label { font-family: var(--font-display); font-size: 1.15rem; min-height: 1.6em; color: var(--magma); }

/* Terre interactive */
.layer { cursor: pointer; transition: filter .2s; }
.layer:hover, .layer.sel { filter: brightness(1.12) drop-shadow(0 0 4px rgba(0,0,0,.35)); }
.layer-info { min-height: 140px; }
.layer-info h3 { font-size: 1.4rem; color: var(--magma); }
.seen-row { display: flex; gap: 8px; flex-wrap: wrap; }
.seen { padding: 4px 10px; border-radius: 999px; border: 2px solid var(--rule); font-size: .9rem; color: var(--muted); }
.seen.on { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); font-weight: 700; }

/* Résultats */
.result { align-items: center; text-align: center; }
.result .big-stars { font-size: 3rem; letter-spacing: 6px; color: var(--rule); line-height: 1; }
.result .big-stars .on { color: var(--lava); display: inline-block; animation: pop .5s backwards; }
.result .big-stars .on:nth-child(2) { animation-delay: .15s; }
.result .big-stars .on:nth-child(3) { animation-delay: .3s; }
.result h2 { font-size: 2rem; }
.result .score { font-size: 1.2rem; font-weight: 700; }
.result .grade { font-family: var(--font-display); font-size: 3.2rem; color: var(--magma); line-height: 1; font-variant-numeric: tabular-nums; }
.review { text-align: left; width: 100%; display: flex; flex-direction: column; gap: 10px; }
.review h3 { font-size: 1.3rem; }
.review .item { border-left: 5px solid var(--bad); background: var(--bg); border-radius: 0 12px 12px 0; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
.review .item .good { color: var(--ok); font-weight: 700; }
.result .row { justify-content: center; }

/* Fiches */
.fiche h2 { color: var(--magma); font-size: 1.6rem; }
.fiche .label { text-transform: uppercase; letter-spacing: .12em; font-size: .8rem; color: var(--muted); font-weight: 700; }
.fiche p { line-height: 1.7; }
.fiche mark { background: var(--blank); color: var(--ink); padding: 0 4px; border-radius: 4px; font-weight: 700; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.fact { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
.fact b { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; color: var(--magma); display: block; font-variant-numeric: tabular-nums; }

.footer { color: var(--muted); font-size: .85rem; text-align: center; }
.icon-btn { border: 2px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 8px 14px; font-weight: 700; }

@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.3); } to { transform: scale(1); } }
@keyframes quake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-3px,1px); } 75% { transform: translate(3px,-1px); } }
@keyframes puff { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.puff { animation: puff 3s ease-in-out infinite; transform-box: fill-box; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 480px) {
  body { font-size: 17px; }
  .card { padding: 16px; }
  .match { grid-template-columns: 1fr 1fr; gap: 8px; }
  .mitem { padding: 10px; font-size: .95rem; }
  .text-holes { font-size: 1.05rem; }
}
</style>

<div class="wrap" id="app" aria-live="polite"></div>

<script>
(function () {
"use strict";

/* ---------- Petits outils ---------- */
var app = document.getElementById("app");
function $all(sel, el) { return Array.prototype.slice.call((el || app).querySelectorAll(sel)); }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(list, n) { return shuffle(list.slice()).slice(0, n); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
var store = {
  get: function (k, d) { try { var v = localStorage.getItem("mission-volcans:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem("mission-volcans:" + k, JSON.stringify(v)); } catch (e) {} }
};
var progress = store.get("progress", {});
var soundOn = store.get("sound", true);
var playerName = store.get("name", "");

var actx = null;
function sound(ok) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    var notes = ok ? [523, 659, 784] : [233, 196];
    notes.forEach(function (f, i) {
      var t = actx.currentTime + i * 0.1;
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = ok ? "triangle" : "square";
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(ok ? 0.18 : 0.06, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + 0.18);
    });
  } catch (e) {}
}
function who() { return playerName ? " " + esc(playerName) : ""; }

/* ---------- Les contenus (tirés des fiches de la classe) ---------- */
/* Dans chaque question, la bonne réponse est toujours la première de la liste c. */
var DEF = [
  { q: "Je me trouve dans la partie centrale de la Terre et je suis composé surtout de fer. Qui suis-je ?", c: ["Le noyau", "Le manteau", "La croûte terrestre", "Le cratère"], why: "Au centre de la Terre se trouve un gros noyau formé surtout de fer." },
  { q: "Je suis la « peau » de la Terre, faite de roches solides. Qui suis-je ?", c: ["La croûte terrestre", "Le noyau", "Le manteau", "La lave"], why: "La croûte terrestre est la « peau » : elle est faite de roches solides." },
  { q: "Je suis la « chair » de la Terre, composée de roches très chaudes et comprimées. Qui suis-je ?", c: ["Le manteau", "La croûte terrestre", "Le noyau", "Le nuage de cendres"], why: "Le manteau, c’est la « chair » de la pêche : des roches très chaudes et comprimées." },
  { q: "Je suis ronde et ma structure peut être comparée à celle d’une pêche. Qui suis-je ?", c: ["La Terre", "La Lune", "Le noyau", "Le volcan"], why: "La Terre est pratiquement ronde, et on compare sa structure à celle d’une pêche." },
  { q: "Je suis le trou au sommet du volcan. Qui suis-je ?", c: ["Le cratère", "La cheminée", "Le magma", "Le noyau"], why: "Un volcan est une montagne dont le sommet comporte un cratère." },
  { q: "Je suis la fissure de la croûte terrestre par laquelle le magma remonte. Qui suis-je ?", c: ["La cheminée", "Le cratère", "Le manteau", "La plaque"], why: "Le volcan est formé autour d’une fissure : la cheminée." },

/* ---------- Écrans communs ---------- */
function screen(title, pct, body) {
  app.innerHTML =
    '<div class="topbar"><button class="back" id="back">← Missions</button><h1>' + title + '</h1></div>' +
    (pct != null ? '<div class="progress" aria-hidden="true"><div style="width:' + Math.round(pct * 100) + '%"></div></div>' : "") +
    body;
  document.getElementById("back").onclick = home;
  window.scrollTo(0, 0);
}
function starsHTML(n, cls) {
  var s = '<span class="' + (cls || "stars") + '" aria-label="' + n + ' étoile' + (n > 1 ? "s" : "") + ' sur 3">';
  for (var i = 0; i < 3; i++) s += i < n ? '<span class="on">★</span>' : "<span>★</span>";
  return s + "</span>";
}
function starsFor(score, total) { var r = total ? score / total : 0; return r >= 0.9 ? 3 : r >= 0.7 ? 2 : r >= 0.4 ? 1 : 0; }

function finish(id, title, score, total, review, opts) {
  opts = opts || {};
  var stars = starsFor(score, total);
  var prev = progress[id] || 0;
  if (stars > prev) { progress[id] = stars; store.set("progress", progress); }
  var msgs = [
    "Pas grave" + who() + " ! Relis la fiche de révision, puis rejoue.",
    "C’est un bon début" + who() + ". Relis la leçon et réessaie !",
    "Très bien" + who() + " ! Encore un petit effort pour les 3 étoiles.",
    "Excellent" + who() + " ! Tu maîtrises cette partie."
  ];
  var head = ["Continue !", "Bon début !", "Bravo !", "Champion·ne des volcans !"][stars];
  var grade = "";
  if (opts.exam) {
    var note = Math.round(score / total * 20 * 2) / 2;
    grade = '<p class="grade">' + String(note).replace(".", ",") + ' / 20</p>';
    store.set("lastExam", note);
  }
  var rev = "";
  if (review && review.length) {
    rev = '<div class="review"><h3>À revoir</h3>' + review.map(function (r) {
      return '<div class="item"><span>' + r.q + '</span><span class="good">✔ ' + r.a + '</span>' + (r.why ? '<span class="hint">' + r.why + '</span>' : "") + "</div>";
    }).join("") + "</div>";
  } else if (total) {
    rev = '<p class="note">Aucune erreur. Tu peux passer à la mission suivante !</p>';
  }
  screen(title, 1,
    '<section class="card result">' + starsHTML(stars, "big-stars") + "<h2>" + head + "</h2>" + grade +
    '<p class="score">' + score + " bonne" + (score > 1 ? "s" : "") + " réponse" + (score > 1 ? "s" : "") + " sur " + total + "</p>" +
    "<p>" + msgs[stars] + "</p>" + rev +
    '<div class="row"><button class="btn" id="again">Rejouer</button><button class="btn alt" id="home2">Retour aux missions</button></div></section>');
  sound(stars >= 2);
  document.getElementById("again").onclick = opts.replay;
  document.getElementById("home2").onclick = home;
}

/* ---------- Quiz à choix (QCM et Vrai/Faux) ---------- */
function runQuiz(id, title, items, opts) {
  opts = opts || {};
  var i = 0, score = 0, review = [];
  function show() {
    var it = items[i];
    var choices = it.vf ? ["Vrai", "Faux"] : shuffle(it.c.slice());
    screen(title, i / items.length,
      '<section class="card"><p class="qnum">Question ' + (i + 1) + " sur " + items.length + (it.vf ? " · Vrai ou faux ?" : "") + "</p>" +
      '<h2 class="qtext">' + it.q + "</h2>" +
      '<div class="choices' + (it.vf ? " vf" : "") + '">' + choices.map(function (c, k) { return '<button class="choice" data-k="' + k + '">' + c + "</button>"; }).join("") + "</div>" +
      '<div class="feedback" id="fb" hidden></div></section>');
    $all(".choice").forEach(function (b) {
      b.onclick = function () {

        });
        if (!ok) { b.classList.add("bad"); review.push({ q: it.q, a: good, why: it.why }); } else score++;
        sound(ok);
        var fb = document.getElementById("fb");
        fb.className = "feedback " + (ok ? "ok" : "bad");
        fb.innerHTML = '<strong class="head">' + (ok ? pick(["Bravo !", "Exact !", "Super !", "Bien joué !"], 1)[0] : "Oups…") + "</strong>" +
          (ok ? "" : "<span>La bonne réponse : <b>" + good + "</b></span>") +
          "<span>" + it.why + "</span>" +
          '<button class="btn" id="next">' + (i + 1 < items.length ? "Question suivante →" : "Voir mon résultat") + "</button>";
        fb.hidden = false;
        var nx = document.getElementById("next");
        nx.focus({ preventScroll: true });
        fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
        nx.onclick = function () { i++; if (i < items.length) show(); else finish(id, title, score, items.length, review, { exam: opts.exam, replay: opts.replay }); };
      };
    });
  }
  show();
}

/* ---------- Moteur « trous » : textes à compléter et légendes ---------- */
function runHoles(cfg) {
  var answers = [];
  cfg.parts.forEach(function (p) { if (typeof p !== "string") answers.push(p.a); });
  var n = answers.length;
  var words = shuffle(answers.concat(cfg.distractors || []));
  var filled = new Array(n).fill(null);     /* index du mot de la réserve */
  var state = new Array(n).fill("");        /* "", "right", "revealed" */
  var active = 0, checks = 0, firstScore = null, wrongFlash = {};
  var review = [];

  function render() {
    var k = 0;
    var holes = cfg.parts.map(function (p) {
      if (typeof p === "string") return p;
      var idx = k++;
      var w = filled[idx] != null ? words[filled[idx]] : null;
      var c = "blank";
      if (state[idx] === "right") c += " right";
      else if (state[idx] === "revealed") c += " revealed";
      else { if (w == null) c += " empty"; if (idx === active) c += " active"; if (wrongFlash[idx]) c += " wrong"; }
      var label = state[idx] === "revealed" ? answers[idx] : (w == null ? "……" : w);
      return '<button class="' + c + '" data-i="' + idx + '" aria-label="Trou ' + (idx + 1) + '">' + label + "</button>";
    }).join("");
    var used = {};
    filled.forEach(function (f) { if (f != null) used[f] = true; });
    var done = state.every(function (s) { return s; });
    var allFilled = filled.every(function (f, i2) { return f != null || state[i2]; });
    var bank = done ? "" : '<div class="bank" aria-label="Réserve de mots">' + words.map(function (w, wi) {
      return used[wi] ? "" : '<button class="chip" data-w="' + wi + '">' + w + "</button>";
    }).join("") + "</div>";
    var body = cfg.layout === "diagram"
      ? '<div class="diagram-row"><div>' + cfg.svg + '</div><ol class="legend-list">' + holes + "</ol></div>"
      : '<div class="text-holes">' + holes + "</div>";
    var status = "";
    if (checks > 0 && !done) status = '<p class="note">Les mots en vert sont justes. Corrige les trous vides et vérifie encore' + (checks === 2 ? " (dernier essai)." : ".") + "</p>";
    screen(cfg.title, done ? 1 : state.filter(Boolean).length / n,
      '<section class="card">' + (cfg.intro ? '<p class="hint">' + cfg.intro + "</p>" : "") + body + status + bank +
      '<div class="row">' + (done
        ? '<button class="btn" id="end">Voir mon résultat</button>'
        : '<button class="btn" id="check"' + (allFilled ? "" : " disabled") + '>Vérifier</button><span class="hint">' + (allFilled ? "Tout est rempli !" : "Touche un trou, puis un mot.") + "</span>") +
      "</div></section>");
    wrongFlash = {};
    $all(".blank").forEach(function (b) {
      b.onclick = function () {
        var i2 = +b.dataset.i;
        if (state[i2]) return;
        if (filled[i2] != null) filled[i2] = null;
        active = i2; render();
      };
    });
    $all(".chip").forEach(function (c) {
      c.onclick = function () {
        if (active == null || state[active]) active = nextEmpty(0);
        if (active == null) return;
        filled[active] = +c.dataset.w;
        active = nextEmpty(active);
        render();
      };
    });
    var ch = document.getElementById("check");
    if (ch) ch.onclick = check;
    var en = document.getElementById("end");
    if (en) en.onclick = function () { finish(cfg.id, cfg.title, firstScore, n, review, { replay: function () { runHoles(cfg); } }); };
  }
  function nextEmpty(from) {
    for (var s = 0; s < n; s++) { var i2 = (from + s) % n; if (!state[i2] && filled[i2] == null) return i2; }
    return null;
  }
  function check() {
    checks++;
    var good = 0;
    for (var i2 = 0; i2 < n; i2++) {
      if (state[i2]) { good++; continue; }
      if (words[filled[i2]] === answers[i2]) { state[i2] = "right"; good++; }
      else {
        if (checks === 1) review.push({ q: (cfg.layout === "diagram" ? "Numéro " + (i2 + 1) : "Trou n°" + (i2 + 1)) + " : tu avais mis « " + words[filled[i2]] + " »", a: answers[i2] });
        filled[i2] = null; wrongFlash[i2] = true;
      }
    }
    if (firstScore == null) firstScore = good;
    sound(good === n);
    if (good < n && checks >= 3) {
      for (var j = 0; j < n; j++) if (!state[j]) state[j] = "revealed";
    }
    active = nextEmpty(0);
    render();
  }
  render();
}

/* ---------- Relie ---------- */
var PAIRS = [
  { l: "Il s’étend sur environ 2800 km d’épaisseur.", r: "le manteau" },
  { l: "Elle est épaisse de 6 à 70 km.", r: "la croûte terrestre" },
  { l: "Il mesure environ 6400 km.", r: "le rayon de la Terre" },
  { l: "Il est formé surtout de fer.", r: "le noyau" },
  { l: "Elles bougent de quelques centimètres par an.", r: "les plaques" }
];
var PAIR_COLORS = ["#e2512a", "#2f7ae5", "#23925a", "#9b4dca", "#d49a00"];
function runRelie() {
  var title = "Relie";
  var left = shuffle(PAIRS.slice());
  var right = shuffle(PAIRS.map(function (p) { return p.r; }));
  var link = {};          /* gauche -> droite */
  var locked = {};
  var selL = null, selR = null, checks = 0, firstScore = null, flash = {}, review = [];
  function colorOf(li) { return PAIR_COLORS[li % PAIR_COLORS.length]; }
  function leftOfRight(ri) { for (var k in link) if (link[k] === ri) return +k; return null; }
  function render() {
    var n = left.length, allLinked = Object.keys(link).length === n, done = Object.keys(locked).length === n;
    var L = left.map(function (p, i) {
      var c = link[i] != null ? colorOf(i) : null;
      return '<button class="mitem' + (selL === i ? " sel" : "") + (locked[i] ? " right" : "") + (flash["l" + i] ? " wrong" : "") + '" data-l="' + i + '">' +
        '<span class="dot" style="' + (c ? "background:" + c + ";border:2px solid " + c : "") + '"></span><span>' + p.l + "</span></button>";
    }).join("");
    var R = right.map(function (r, i) {
      var li = leftOfRight(i), c = li != null ? colorOf(li) : null;
      return '<button class="mitem' + (selR === i ? " sel" : "") + (li != null && locked[li] ? " right" : "") + '" data-r="' + i + '">' +
        '<span class="dot" style="' + (c ? "background:" + c + ";border:2px solid " + c : "") + '"></span><span><b>' + r + "</b></span></button>";
    }).join("");
    screen(title, Object.keys(locked).length / n,
      '<section class="card"><p class="hint">Touche une phrase à gauche, puis ce qui lui correspond à droite. Les deux prennent la même couleur.</p>' +
      '<div class="match"><div class="col">' + L + '</div><div class="col">' + R + "</div></div>" +
      (checks && !done ? '<p class="note">Les paires en vert sont justes. Refais les autres.</p>' : "") +
      '<div class="row">' + (done ? '<button class="btn" id="end">Voir mon résultat</button>' : '<button class="btn" id="check"' + (allLinked ? "" : " disabled") + ">Vérifier</button>") + "</div></section>");
    flash = {};
    $all("[data-l]").forEach(function (b) {
      b.onclick = function () {
        var i = +b.dataset.l; if (locked[i]) return;
        if (link[i] != null && selR == null) { delete link[i]; }
        selL = i; tryPair(); render();
      };
    });
    $all("[data-r]").forEach(function (b) {
      b.onclick = function () {
        var i = +b.dataset.r, li = leftOfRight(i);
        if (li != null && locked[li]) return;
        if (li != null && selL == null) { delete link[li]; }
        selR = i; tryPair(); render();
      };
    });
    var ch = document.getElementById("check");
    if (ch) ch.onclick = check;
    var en = document.getElementById("end");
    if (en) en.onclick = function () { finish("relie", title, firstScore, n, review, { replay: runRelie }); };
  }
  function tryPair() {
    if (selL == null || selR == null) return;
    var other = leftOfRight(selR);
    if (other != null) delete link[other];
    link[selL] = selR; selL = selR = null;
  }
  function check() {
    checks++;
    var good = 0;
    left.forEach(function (p, i) {
      if (locked[i]) { good++; return; }
      if (right[link[i]] === p.r) { locked[i] = true; good++; }
      else { if (checks === 1) review.push({ q: p.l, a: p.r }); delete link[i]; flash["l" + i] = true; }
    });
    if (firstScore == null) firstScore = good;
    sound(good === left.length);
    if (good < left.length && checks >= 3) left.forEach(function (p, i) { if (!locked[i]) { link[i] = right.indexOf(p.r); locked[i] = true; } });
    render();
  }
  render();
}

var STEPS = [
  "Sous le volcan, le magma (des roches très chaudes et partiellement fondues) se trouve dans le sous-sol.",
  "Le magma remonte par la cheminée.",
  "Il est éjecté en surface par le cratère : c’est l’éruption volcanique.",
  "On l’appelle maintenant la lave. Elle coule, et un nuage de cendres apparaît.",
  "En refroidissant, la lave devient de la roche solide (les anciennes coulées)."
];
function runOrdre() {
  var title = "L’éruption dans l’ordre";
  var pool = shuffle(STEPS.map(function (s, i) { return i; }));
  var placed = [], errors = 0;
  function render(wrongIdx) {
    var done = placed.length === STEPS.length;
    screen(title, placed.length / STEPS.length,
      '<section class="card"><p class="hint">Que se passe-t-il pendant une éruption ? Touche les étapes <b>dans le bon ordre</b>, de la première à la dernière.</p>' +
      (placed.length ? '<ol class="order-done">' + placed.map(function (i) { return "<li><span>" + STEPS[i] + "</span></li>"; }).join("") + "</ol>" : "") +
      (done ? '<p class="note">Bravo, l’éruption est complète !</p><div class="row"><button class="btn" id="end">Voir mon résultat</button></div>'
        : '<p class="qnum">Étape ' + (placed.length + 1) + ' : laquelle vient maintenant ?</p><div class="order-pool">' + pool.map(function (i) {
          return '<button class="ocard' + (wrongIdx === i ? " wrong" : "") + '" data-s="' + i + '">' + STEPS[i] + "</button>";
        }).join("") + "</div>") + "</section>");
    $all("[data-s]").forEach(function (b) {
      b.onclick = function () {
        var i = +b.dataset.s;
        if (i === placed.length) { placed.push(i); pool.splice(pool.indexOf(i), 1); sound(true); render(); }
        else { errors++; sound(false); render(i); }
      };
    });
    var en = document.getElementById("end");
    if (en) en.onclick = function () {
      var score = Math.max(0, STEPS.length - errors);
      finish("eruption", title, score, STEPS.length, errors ? [{ q: "L’ordre d’une éruption", a: "magma dans le sous-sol → remonte par la cheminée → éruption au cratère → lave et nuage de cendres → roche solide" }] : [], { replay: runOrdre });
    };
  }
  render();
}

    { id: "vf", n: 12, t: "Vrai ou faux ?", s: "Dix affirmations à juger", run: function () { runQuiz("vf", "Vrai ou faux ?", pick(VF_Q, 10), { replay: MISSION_BY_ID.vf.run }); } }
  ] }
];
var MISSION_BY_ID = {};
SECTIONS.forEach(function (s) { s.missions.forEach(function (m) { MISSION_BY_ID[m.id] = m; }); });

function home() {
  var total = 0, max = 0;
  SECTIONS.forEach(function (s) { s.missions.forEach(function (m) { total += progress[m.id] || 0; max += 3; }); });
  total += progress.exam || 0; max += 3;
  var last = store.get("lastExam", null);
  app.innerHTML =
    '<header class="hero"><div><p class="eyebrow">Sciences · Thème 1</p><h1>Mission Volcans<span>La Terre et les volcans</span></h1></div>' + volcanoMiniSVG() + "</header>" +
    '<div class="toolbar"><div class="name-field"><label for="pname">Mon prénom</label><input id="pname" maxlength="20" autocomplete="off" placeholder="Écris ton prénom" value="' + esc(playerName) + '"></div>' +
    '<span class="pill"><span class="star">★</span> ' + total + " / " + max + '</span><button class="icon-btn" id="snd" aria-pressed="' + soundOn + '">Son : ' + (soundOn ? "oui" : "non") + "</button></div>" +
    SECTIONS.map(function (s) {
      return '<div class="section-title"><h2>' + s.title + "</h2><small>" + s.sub + '</small></div><div class="missions">' +
        s.missions.map(function (m) {
          return '<button class="mission" data-m="' + m.id + '"><span class="num">' + m.n + '</span><span class="t">' + m.t + '</span><span class="s">' + m.s + "</span>" + starsHTML(progress[m.id] || 0) + "</button>";
        }).join("") +
        (s.title === "Tout réviser"
          ? '<button class="mission" id="fiches"><span class="num">?</span><span class="t">Mes fiches de révision</span><span class="s">Les deux leçons complètes, à relire</span><span class="stars">&nbsp;</span></button>' +
            '<button class="mission big" id="exam"><span class="num">20</span><span class="t">Évaluation blanche</span><span class="s">18 questions mélangées, notées sur 20' + (last != null ? " · dernière note : " + String(last).replace(".", ",") + "/20" : "") + "</span>" + starsHTML(progress.exam || 0) + "</button>"
          : "") + "</div>";
    }).join("") +
    '<p class="footer">Les bonnes réponses viennent des fiches de la classe : Leçon 1 « La structure de la Terre » et Leçon 2 « Les volcans ».</p>';
  window.scrollTo(0, 0);
  $all("[data-m]").forEach(function (b) { b.onclick = function () { MISSION_BY_ID[b.dataset.m].run(); }; });
  document.getElementById("exam").onclick = runExam;
  document.getElementById("fiches").onclick = runFiches;
  var input = document.getElementById("pname");
  input.oninput = function () { playerName = input.value.trim(); store.set("name", playerName); };
  document.getElementById("snd").onclick = function () { soundOn = !soundOn; store.set("sound", soundOn); home(); };
}

home();
})();
</script>
<!-- ARTIFACT-END -->
</html>
